name: RTL smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Run instruction decoder unit test
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          iverilog -g2012 -Wall -s tb_instruction_decoder \
            -o "$build_dir/decoder.vvp" rtl/control/instruction_decoder.v tb/tb_instruction_decoder.v
          vvp "$build_dir/decoder.vvp"

      - name: Run immediate generator signed-encoding test
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          iverilog -g2012 -Wall -s tb_immediate_generator \
            -o "$build_dir/immediate.vvp" rtl/datapath/immediate_generator.v tb/tb_immediate_generator.v
          vvp "$build_dir/immediate.vvp"

      - name: Run data memory read/write test
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          iverilog -g2012 -Wall -s tb_data_memory \
            -o "$build_dir/data_memory.vvp" rtl/memory/data_memory.v tb/tb_data_memory.v
          vvp "$build_dir/data_memory.vvp"

      - name: Run next-PC mux selection test
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          iverilog -g2012 -Wall -s tb_next_pc_mux \
            -o "$build_dir/next_pc_mux.vvp" rtl/datapath/next_pc_mux.v tb/tb_next_pc_mux.v
          vvp "$build_dir/next_pc_mux.vvp"

      - name: Run top-level RV32I smoke test
        run: bash sim/run_smoke.sh
