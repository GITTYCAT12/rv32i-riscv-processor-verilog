name: RTL smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Run instruction decoder unit test
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          iverilog -g2012 -Wall -s tb_instruction_decoder \
            -o "$build_dir/decoder.vvp" rtl/control/instruction_decoder.v tb/tb_instruction_decoder.v
          vvp "$build_dir/decoder.vvp"

      - name: Run top-level RV32I smoke test
        run: bash sim/run_smoke.sh
